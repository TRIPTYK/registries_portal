name: registries

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.6-trixie@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
    environment:
      POSTGRES_USER: registries
      POSTGRES_DB: registries
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  backend:
    image: ${REGISTRY:?REGISTRY manquant (fourni par deploy.sh)}/backend:${IMAGE_TAG:?IMAGE_TAG manquant (fourni par deploy.sh)}
    environment: &backend-environment
      PORT: "8000"
      HOST: 0.0.0.0
      PRODUCTION_ENV: "true"
      DEBUG: "false"
      SERVER_URL: https://registries.triptyk.be
      APP_URL: https://registries.triptyk.be
      FEATURE_TODOS: "false"
      FEATURE_INCIDENT_REGISTRY: "false"
      FEATURE_ACCESS_REGISTRY: "true"
      SMTP_HOST: smtp.eu.mailgun.org
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      EMAIL_FROM_ADDRESS: no-reply@triptyk.be
      DATABASE_URI_FILE: /run/secrets/database_uri
      SESSION_KEY_FILE: /run/secrets/session_key
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_REFRESH_SECRET_FILE: /run/secrets/jwt_refresh_secret
      EXPORT_SIGNING_KEY_FILE: /run/secrets/export_signing_key
      SMTP_USER_FILE: /run/secrets/smtp_user
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    secrets: &backend-secrets
      - database_uri
      - session_key
      - jwt_secret
      - jwt_refresh_secret
      - export_signing_key
      - smtp_user
      - smtp_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/api/v1/status').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    init: true
    restart: unless-stopped
    logging: *default-logging

  # Met la base au niveau de l'image avant le backend, à chaque déploiement :
  # migrations, triggers append-only, rôles et référentiels. Idempotent. S'il
  # échoue, le backend ne démarre pas et `up` s'arrête en erreur.
  migrate:
    image: ${REGISTRY:?REGISTRY manquant (fourni par deploy.sh)}/backend:${IMAGE_TAG:?IMAGE_TAG manquant (fourni par deploy.sh)}
    command: ["./node_modules/.bin/vite-node", "src/cli/migrate.ts"]
    # Même configuration que le backend : mikro-orm.config.ts la valide en entier.
    environment: *backend-environment
    secrets: *backend-secrets
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: "no"
    logging: *default-logging

  caddy:
    image: ${REGISTRY:?REGISTRY manquant (fourni par deploy.sh)}/front:${IMAGE_TAG:?IMAGE_TAG manquant (fourni par deploy.sh)}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  cloudflared:
    image: cloudflare/cloudflared:2026.10.2@sha256:0e56c13c7058fcef9c4f0e7d83372f82330548dbf8f8b366f3d8b506526d93b2
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN manquant (fourni par deploy.sh)}
    depends_on:
      caddy:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

secrets:
  database_uri:
    environment: DATABASE_URI
  session_key:
    environment: SESSION_KEY
  jwt_secret:
    environment: JWT_SECRET
  jwt_refresh_secret:
    environment: JWT_REFRESH_SECRET
  export_signing_key:
    environment: EXPORT_SIGNING_KEY
  smtp_user:
    environment: SMTP_USER
  smtp_password:
    environment: SMTP_PASSWORD
  postgres_password:
    environment: POSTGRES_PASSWORD

volumes:
  postgres-data:
