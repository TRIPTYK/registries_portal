name: Tests

# Push de branche uniquement : sur un tag, cette suite passe par release.yaml, qui
# l'appelle avant de construire la moindre image.
on:
  push:
    branches: ['**']
  release:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: wyvox/action-setup-pnpm@v3
      - name: Build
        run: pnpm turbo build --filter='@libs/*'
      - name: Install Playwright Browsers
        uses: ./.github/actions/playwright-install
        with:
          working-directory: ./@apps/e2e
          browsers: chromium
      - name: Lint
        run: pnpm turbo lint
      - name: Run frontend tests
        run: pnpm turbo test --filter='@apps/front' --filter='@libs/*-front' --concurrency=1
      - name: Run backend tests
        run: pnpm turbo test --filter='@libs/*-backend' --filter='@apps/backend'